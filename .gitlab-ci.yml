# Publishes to the public PyPI on every push to main. Needs the masked
# PYPI_API_TOKEN CI/CD variable. version:check guarantees each merge carries a
# new version, so a publish never tries to re-upload an existing one.
publish:pypi:public:
  stage: publish
  needs:
    - build:package
  variables:
    TWINE_USERNAME: "__token__"
    TWINE_PASSWORD: "$PYPI_API_TOKEN"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  script:
    - pip install twine
    - twine upload --non-interactive dist/*
