# Pipeline for ckanext-zenodo: lint, security, pure unit tests, package
# build, and publication to the public PyPI on every merge to main (validation
# and production install extensions straight from PyPI, so a merged change must
# land there). The fair3r-docker-alt integration test job is added once the
# plugin is deployed.

stages:
  - pre-validate
  - validate
  - build
  - publish

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never

default:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10-slim
  tags:
    - ics-docker
  before_script:
    - python -m pip install --upgrade pip

# Blocks a merge request that does not bump the version compared to main.
version:check:
  stage: pre-validate
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - git fetch origin main
  script:
    - |
      LOCAL_VER=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
      REMOTE_VER=$(git show origin/main:pyproject.toml | grep -m1 '^version' | cut -d'"' -f2)
      echo "Local version: $LOCAL_VER, Remote (main) version: $REMOTE_VER"
      if [ "$LOCAL_VER" = "$REMOTE_VER" ]; then
        echo "Error: the version must be incremented before merging (current: $LOCAL_VER)";
        exit 1;
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always

lint:ruff:
  stage: validate
  script:
    - pip install ruff==0.16.0
    - ruff check ckanext
    - ruff format --check ckanext

security:bandit:
  stage: validate
  script:
    # bandit needs the "toml" extra to parse pyproject.toml on Python < 3.11.
    - pip install 'bandit[toml]'
    - bandit -c pyproject.toml -r ckanext

test:pure-unit:
  stage: validate
  variables:
    # zenodo_client.py has no ckan import at all (see its own docstring),
    # so the conftest.py guard requiring --ckan-ini=test.ini doesn't apply -
    # same pattern as ckanext-citations' equivalent job.
    ZENODO_ALLOW_NON_TEST_INI: "1"
  script:
    - pip install pytest==7.4.4 requests
    - pytest ckanext/zenodo/tests/test_zenodo_client.py ckanext/zenodo/tests/test_metadata_mapper.py

build:package:
  stage: build
  script:
    - pip install build twine
    - python -m build
    - twine check dist/*
    # fair3r-docker-alt fetches this job's artifact by ID (trigger below).
    - echo "BUILD_JOB_ID=$CI_JOB_ID" > build.env
  artifacts:
    expire_in: 7 days
    paths:
      - dist/
    reports:
      dotenv: build.env

# Starts the integration deploy and tests in fair3r-docker-alt on each MR.
# Disabled until the plugin is actually wired into fair3r-docker-alt's
# Ansible roles/CI (not part of the Stage 0 scaffold).
